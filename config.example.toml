# Copy this file to config.toml and review every device-specific value before
# connecting to hardware. config.toml is ignored by Git.

[robot]
ip = "192.168.1.230" # REPLACE with the UF850 controller IPv4 address.
namespace = "/ufactory"
report_type = "dev"
add_gripper = true

[network]
bind_host = "0.0.0.0"
listen_port = 5005
feedback_port = 5006
feedback_hz = 4.0
quest_ip = "" # Empty means lock to the first valid Quest sender.
quest_ready_timeout_s = 15.0

[control]
publish_hz = 50.0
linear_speed_mm_s = 50.0 # Keep 50 for the first supervised hardware test.
angular_speed_rad_s = 0.3
command_duration_s = 0.15
deadband = 0.05
linear_accel_mm_s2 = 1000.0
angular_accel_rad_s2 = 1.5

[safety]
watchdog_s = 0.20
collection_lease_timeout_s = 0.50
neutral_packets_to_arm = 3
workspace_enabled = true
x_mm = [0.0, 600.0]
y_mm = [0.0, 650.0]
z_mm = [170.0, 650.0]

[reset]
# DEVICE-SPECIFIC EXAMPLE. Verify the entire joint-space path on your UF850.
# Never run reset_arm on a different setup without recalibrating this pose.
joint_angles_deg = [55.399232, 7.733498, -48.980042, -1.039517, -57.38115, -0.614669]
speed_deg_s = 30.0
acceleration_deg_s2 = 100.0
timeout_s = 15.0
pause_s = 2.0
countdown_s = 3.0
tolerance_deg = 2.0
open_gripper = true
gripper_open_position = 800
gripper_speed = 1000

[recording]
hz = 10.0
width = 1920
height = 1080
fps = 30
pixel_format = "yuyv"
frame_buffer_size = 4
max_camera_skew_ms = 50.0
max_frame_age_ms = 150.0
warmup_frames = 30
save_queue_size = 16
jpeg_quality = 95
min_free_gb = 20.0
failure_timeout_s = 2.0
startup_timeout_s = 8.0

[[cameras]]
name = "cam_0"
role = "wrist"
serial = "REPLACE_WITH_WRIST_REALSENSE_SERIAL"

[[cameras]]
name = "cam_1"
role = "external"
serial = "REPLACE_WITH_EXTERNAL_REALSENSE_SERIAL"

[paths]
ros_setup = "/opt/ros/jazzy/setup.bash"
workspace_setup = "~/ros2_ws/install/setup.bash"
system_python = "/usr/bin/python3"
collector_python = "~/robot_env/bin/python"
data_root = "data"
runtime_dir = ".runtime"
logs_dir = "logs"

[hotspot]
ssid = "MyRobotHotspot"
interface = "REPLACE_WITH_WIFI_INTERFACE"
password_env = "VR_HOTSPOT_PASSWORD"
